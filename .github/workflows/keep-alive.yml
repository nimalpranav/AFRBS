name: Keep Streamlit App Awake
on:
  schedule:
    - cron: '0 */8 * * *' # Runs every 8 hours (under the 12-hour limit)
  workflow_dispatch:      # Lets you test it manually from the Actions tab
jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: gpenessot/streamlit-keep-alive@main
        with:
          app-urls: |
            https://recovery.streamlit.app
